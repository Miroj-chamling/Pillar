spring:
  application:
    name: finance-app

  # Reactive connection used by the app at runtime (non-blocking driver)
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/finance
    username: finance
    password: finance

  # Flyway runs migrations once at startup over plain JDBC (blocking is fine here)
  flyway:
    url: jdbc:postgresql://localhost:5433/finance
    user: finance
    password: finance

app:
  jwt:
    # HS256 signing key, min 32 bytes. The default is for local dev ONLY - set JWT_SECRET elsewhere.
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    ttl: 1h
  admin:
    # Bootstrap admin, created on first startup if missing. Override with env vars outside dev.
    email: ${ADMIN_EMAIL:admin@finance.local}
    password: ${ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    # Shows every SQL statement R2DBC sends - great for learning
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG
